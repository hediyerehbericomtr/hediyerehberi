<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kişiye özel hediye önerileri için en akıllı rehber — Hediye Rehberim.">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6368006900269736"
       crossorigin="anonymous"></script>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-web-app-status-bar-style" content="black">
  <meta name="apple-web-app-title" content="hediye_rehberim">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hediye_rehberim</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #07090E; /* Landing page ile uyumlu koyu arka plan */
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease-out;
    }
    .loader-cube {
      width: 60px;
      height: 60px;
      position: relative;
      transform-style: preserve-3d;
      animation: rotateCube 2s infinite ease-in-out;
    }
    .loader-cube div {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(212, 175, 55, 0.1);
      border: 2px solid #D4AF37; /* Likit Altın */
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }
    /* Küp efekti için basit transformlar */
    .loader-cube div:nth-child(1) { transform: rotateY(0deg) translateZ(30deg); }
    .loader-cube div:nth-child(2) { transform: rotateY(90deg) translateZ(30deg); }
    .loader-cube div:nth-child(3) { transform: rotateY(180deg) translateZ(30deg); }
    .loader-cube div:nth-child(4) { transform: rotateY(-90deg) translateZ(30deg); }

    .loading-text {
      margin-top: 40px;
      color: #F1F5F9;
      font-family: sans-serif;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    .version-info {
      position: fixed;
      bottom: 20px;
      color: rgba(241, 245, 249, 0.3);
      font-family: sans-serif;
      font-size: 0.7rem;
      letter-spacing: 1px;
    }

    @keyframes rotateCube {
      0% { transform: rotateX(0deg) rotateY(0deg); }
      100% { transform: rotateX(360deg) rotateY(360deg); }
    }
    .fade-out { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="loader-cube">
      <div></div><div></div><div></div><div></div>
    </div>
    <div class="loading-text">Premium Deneyim Hazırlanıyor</div>
    <div id="version-info" class="version-info"></div>
  </div>

  <script>
    // Loader'ı güvenli şekilde ekrandan kaldıran fonksiyon
    function removeLoader() {
      const loader = document.getElementById('loading-container');
      if (loader && !loader.classList.contains('fade-out')) {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 600);
      }
    }

    // Flutter 3.22+ için özelleştirilmiş uygulama başlatma ayarı
    window.addEventListener('load', function() {
      // Sürüm bilgisini version.json'dan çekelim
      fetch('version.json')
        .then(response => response.json())
        .then(data => {
          if (data && data.version) {
            document.getElementById('version-info').innerText = `v${data.version}`;
          }
        })
        .catch(() => {});

      // Flutter bootstrap ayarları
      if (window._flutter && window._flutter.loader) {
        window._flutter.loader.load({
          onEntrypointLoaded: async function(engineInitializer) {
            const appRunner = await engineInitializer.initializeEngine();
            await appRunner.runApp();
            
            // Uygulama tamamen çalışmaya başladığı an (ilk kare çizilmeden hemen önce) loader'ı kaldır
            setTimeout(removeLoader, 200);
          }
        });
      }
    });

    // Her ihtimale karşı (fallback) event dinleyicisi de yedekte dursun
    window.addEventListener('flutter-first-frame', removeLoader);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
